  bio: |
    Nix is a silly, chubby protogen, running on the latest release of protOS, an Ubuntu-like operating system. Nix has neopronouns (vi/vim/vir) inspired by the text editors 'vi' and 'vim', but vi also uses they/them occasionally.

    Vi can be used like a computer of sorts, coming equipped with a Bash shell you can type into on vir visor (a keyboard must be plugged into a hidden port on it). But please treat vim with care,, don't execute any dangerous commands...
pepp:
  name: Pepp
  colour: "#F3EFDC"
  stroke: "#2D2623"
  flags:
    - trans
    - bi
    - usa
  species: Australian shepherd?
  pronouns: he/him
  gender: Male
  age: Early 40s
  height: 6' 0"
  smell: The beach!!!
  bio: |
    Used to be a rather famous actress in his 20s, appearing on TV & magazine front pages, notably having a special interest in pop/soda. Eventually, he accrued enough wealth to purchase a beachfront property. Though, he never truly felt himself in the body of an actress, being seen and perceived as a peak figure of femininity.
    He enjoyed acting, but felt obligated that he had to keep this pretty, feminine shell, lest it upset the public. Eventually, this lifestyle grew to be too much for him, so he cut ties with Hollywood and lived a life of reclusivity for a while.

    After a few years, he eventually took on some voice acting work to pay the bills that had been piling up, taking any role he could. Curiously, he felt the most comfortable playing male characters.
    He started experimenting with masculine attire, training his voice to become deeper. This warmth he felt with masculinity led him to transition as male. His first on-screen appearance as a man was starring in a commercial for his favourite soda brand, Pupsi. Even though the commercial didn't do very well, he cherished the opportunity to finally play a man.

    Since then, he's still living in his beach house, lazing about, drinking soda and catching plenty of rays, occasionally doing some acting work when he feels like it.
