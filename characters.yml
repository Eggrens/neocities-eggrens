arwe:
  name: "Arwe (Ar&#x1bf;e)"
  colour: "#1E5B52"
  stroke: "#5CC1DB"
  flags:
    - pan
    # - dragon
  species: Dragon
  pronouns: she/her
  gender: Female
  age: ~700 years old
  height: 9' 8"
  smell: Campfire
  bio: |
    Arwe used to live in 14-15th century England among other dragons, living in harmony with humans. She gets her name from the old English word for 'arrow' (arwe), due to the arrow-like patterns on her scales.
    Tensions grew between dragons and humans, forcing the once peaceful dragon nation to retaliate against human attacks, burning down their settlements with their fire breathing. The war raged on, and Arwe had no choice but to leave her home.
    Wounded, she stumbled into a hidden cave and laid there to hide and rest. Through some unexplained force, she hibernated for centuries, eventually waking up in the modern day.

    She now finds herself lost in the modern world, among other anthro animal species who had developed alongside humans. There still is a dragon population, but much fewer in number compared to her time.
    Since her awakening, Arwe strives to understand this new world with each passing day, learning the customs, making friends, and preserving what's left of her dragon culture. She enjoys having guests over for a huge medieval-style feast once in a while.

    Arwe speaks in a Middle English-like accent. I like to show this by using old English letters (such as wynn [&#x1bf;], thorn [&#xfe;], eth [&#xf0;] and yogh [&#x21d;]) in her speech, since dragon scribes in her time kept these letters that had gone out of fashion from the language.
